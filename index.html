<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiseTask</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("wisetask.theme");
        } catch (error) {
          theme = null;
        }
        if (theme !== "day" && theme !== "night") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
        }
        document.documentElement.dataset.theme = theme;
        var motion = null;
        try {
          motion = localStorage.getItem("wisetask.motion");
        } catch (error) {
          motion = null;
        }
        document.documentElement.dataset.motion = motion === "off" ? "off" : "on";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
